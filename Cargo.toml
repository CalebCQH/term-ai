[package]
name = "term-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
clap = { version = "4.6.0", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.51.1", features = ["full"] }
serde_json = "1"
once_cell = "1.18"
dirs = "5.0"
toml = "0.8"
